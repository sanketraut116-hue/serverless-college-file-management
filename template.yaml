AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless College File Management System - S3 Storage

Resources:
  CollegeFilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: ServerlessCollegeFileManagementSystem

Outputs:
  BucketName:
    Description: College file storage bucket name
    Value: !Ref CollegeFilesBucket
